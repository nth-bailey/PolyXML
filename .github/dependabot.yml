version: 2
updates:
  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Rust Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Python dependencies (polyxml-python)
  - package-ecosystem: "pip"
    directory: "/crates/polyxml-python"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-python)"

  # Node.js dependencies (polyxml-js)
  - package-ecosystem: "npm"
    directory: "/crates/polyxml-js"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-js)"

  # Java dependencies (bindings/java)
  - package-ecosystem: "maven"
    directory: "/bindings/java"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-java)"

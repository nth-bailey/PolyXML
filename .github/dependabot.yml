version: 2
updates:
  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Rust Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "quick-xml"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pyo3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "napi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "napi-derive"
        update-types: ["version-update:semver-major"]
      - dependency-name: "criterion"
        update-types: ["version-update:semver-major"]
    groups:
      cargo:
        patterns:
          - "*"

  # Python dependencies (polyxml-python)
  - package-ecosystem: "pip"
    directory: "/crates/polyxml-python"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-python)"
    groups:
      python:
        patterns:
          - "*"

  # Node.js dependencies (polyxml-js)
  - package-ecosystem: "npm"
    directory: "/crates/polyxml-js"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-js)"
    groups:
      npm:
        patterns:
          - "*"

  # Java dependencies (bindings/java)
  - package-ecosystem: "maven"
    directory: "/bindings/java"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-java)"
    groups:
      maven:
        patterns:
          - "*"


name: Release Homebrew (homebrew-polyxml)

concurrency:
  group: release-homebrew
  cancel-in-progress: false

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to bump to (e.g. v0.5.0)"
        required: true

jobs:
  homebrew:
    name: Bump Homebrew Formula
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: polyxml
          homebrew-tap: nth-bailey/homebrew-polyxml
          base-branch: main
          tag-name: ${{ steps.tag.outputs.name }}
          commit-message: "chore(formula): bump polyxml to ${{ steps.tag.outputs.name }}"
        env:
          COMMITTER_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

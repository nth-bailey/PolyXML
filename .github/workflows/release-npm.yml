name: Release Node.js Addon (npm)

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: cd crates/polyxml-js && npx @napi-rs/cli build --platform --target x86_64-unknown-linux-gnu
          - host: macos-latest
            target: x86_64-apple-darwin
            build: cd crates/polyxml-js && npx @napi-rs/cli build --platform --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: cd crates/polyxml-js && npx @napi-rs/cli build --platform --target aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: cd crates/polyxml-js && npx @napi-rs/cli build --platform --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Tag Version Across Manifests
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            echo "Synchronizing version from tag to: $TAG_VER"
            python scripts/sync_version.py --set "$TAG_VER"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Dependencies
        run: npm install -g @napi-rs/cli

      - name: Build Native Module
        shell: bash
        run: ${{ matrix.settings.build }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/polyxml-js/*.node
          if-no-files-found: ignore

  publish:
    name: Publish to npm
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Tag Version Across Manifests
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            echo "Synchronizing version from tag to: $TAG_VER"
            python scripts/sync_version.py --set "$TAG_VER"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm CLI
        run: npm install -g npm@latest

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: crates/polyxml-js
          pattern: bindings-*
          merge-multiple: true

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd crates/polyxml-js
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Publishing to npm using NPM_TOKEN with provenance..."
            npm publish --access public --provenance
          else
            echo "Attempting tokenless publish via npm Trusted Publishing (OIDC)..."
            npm publish --access public --provenance
          fi

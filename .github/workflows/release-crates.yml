name: Release Crates (crates.io)

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Sync Tag Version Across Manifests
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            echo "Synchronizing version from tag to: $TAG_VER"
            python scripts/sync_version.py --set "$TAG_VER"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io via OIDC (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
        continue-on-error: true

      - name: Publish polyxml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cargo publish -p polyxml || echo "polyxml publish exited with code $? (already published or error)"
            sleep 15
            cargo publish -p polyxml-c || echo "polyxml-c publish exited with code $? (already published or error)"
          else
            echo "CARGO_REGISTRY_TOKEN not configured; running dry run for polyxml..."
            cargo publish -p polyxml --dry-run
          fi

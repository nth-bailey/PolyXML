name: Release Crates (crates.io)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish polyxml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cargo publish -p polyxml
            sleep 15
            cargo publish -p polyxml-c
          else
            echo "Dry run: cargo publish --dry-run"
            cargo publish -p polyxml --dry-run
            cargo publish -p polyxml-c --dry-run
          fi

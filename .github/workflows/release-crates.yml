name: Release Crates (crates.io)

concurrency:
  group: release-crates-${{ github.ref_name || github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Sync Tag Version Across Manifests
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            echo "Synchronizing version from tag to: $TAG_VER"
            python scripts/sync_version.py --set "$TAG_VER"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io via OIDC (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
        continue-on-error: true

      - name: Publish polyxml crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "No crates.io publishing token available." >&2
            exit 1
          fi
          publish_crate() {
            local crate="$1" output
            if output=$(cargo publish -p "$crate" 2>&1); then
              echo "$output"
              return 0
            fi
            if grep -Eq "crate ${crate}@[[:graph:]]+ already exists on" <<< "$output"; then
              echo "$crate version already published on crates.io — skipping."
              return 0
            fi
            echo "$output" >&2
            return 1
          }
          publish_crate polyxml
          sleep 15
          publish_crate polyxml-c
          sleep 15
          publish_crate polyxml-cli
